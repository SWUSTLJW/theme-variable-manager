<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Theme Variable Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <h1>Theme Variable Manager</h1>

  <!-- 添加变量按钮 -->
  <div class="controls">
    <button id="add-variable">Add Variable</button>
    <button id="save-variables">Save</button>
  </div>

  <!-- 变量表格 -->
  <table id="variable-table">
    <thead>
      <tr>
        <th>Variable Name</th>
        <!-- <th>Comment</th> -->
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- 添加变量模态框 -->
  <div id="add-variable-modal" class="modal">
    <div class="modal-content">
      <span class="close-add-variable">&times;</span>
      <h2>Add Variable</h2>
      <form id="add-variable-form">
        <div class="form-group">
          <label for="add-variable-name">Variable Name:</label>
          <input type="text" id="add-variable-name" placeholder="Enter variable name" autocomplete="off" required>
        </div>

        <div class="form-group">
          <label for="add-comment">Comment (optional):</label>
          <input type="text" id="add-comment" placeholder="Enter comment (optional)" autocomplete="off">
        </div>

        <!-- 主题输入字段 -->
        <div class="theme-fields">
          <!-- 动态生成的主题输入字段将插入到这里 -->
        </div>

        <div class="form-actions">
          <button type="submit">Add</button>
        </div>
      </form>
    </div>
  </div>


  <!-- 编辑变量模态框 -->
  <div id="edit-variable-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Variable</h2>
      <form id="edit-variable-form">
        <div class="form-group">
          <label for="edit-variable-name">Variable Name:</label>
          <input type="text" id="edit-variable-name" placeholder="Enter variable name" required autocomplete="off">
        </div>

        <div class="form-actions">
          <button id="confirm-edit-variable" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>


  <script src="app.js"></script>
</body>

</html>
